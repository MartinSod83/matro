function art(r){
  return `<img src="${recipeArt[r.id-1]}" alt="" width="318" height="241">`;
}
function cards(rs){return `<div class="grid">${rs.map(r=>`<article class="recipe"><div class="art" style="--bg:${r.bg}" onclick="show(${r.id})">${art(r)}</div><button class="heart" aria-label="Spara favorit" onclick="fav(${r.id})">${state.fav.includes(r.id)?'♥':'♡'}</button><div class="info" onclick="show(${r.id})"><b>${r.name}</b><small>${r.time} min · ${r.cat}</small></div></article>`).join('')}</div>${rs.length?'':'<p class="muted">Inga recept hittades.</p>'}`}
function results(){let rs=recipes.filter(r=>(filter==='Alla'||(filter==='Snabblagat'?r.time<=25:r.cat===filter))&&(!query||(r.name+' '+r.ingredients.map(i=>i[2]).join(' ')).toLowerCase().includes(query.toLowerCase())));$('results').innerHTML=cards(rs)}function setFilter(f){filter=f;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('active',b.textContent===f));results()}
function render(){ $('nav').innerHTML=['⌂|Upptäck','⌕|Sök','♡|Mina recept','▦|Veckomeny','☷|Inköpslista'].map((x,i)=>`<button class="${tab===i?'sel':''}" aria-current="${tab===i?'page':'false'}" onclick="go(${i})">${icon(i)}${x.split('|')[1]}</button>`).join('');let v=$('view');if(tab<2){v.innerHTML=`<h1>${tab?'Hitta ditt recept':'Vad ska vi äta?'}</h1><p class="muted">${tab?'Sök på maträtt eller ingrediens.':'God mat. Mindre vardagsstress.'}</p><input type="search" placeholder="Sök recept eller ingrediens" value="${esc(query)}" oninput="query=this.value;results()"><div class="chips">${['Alla','Snabblagat','Vegetariskt','Budget','Barnvänligt'].map(f=>`<button class="${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><h2>${tab?'Sökresultat':'Inspiration till middagen'}</h2><div id="results"></div><p class="note">Prototyp · Sex egna exempelrecept. Extern receptsökning är inte ansluten.</p>`;results()}else if(tab===2){v.innerHTML=`<h1>Mina recept</h1><h2>Favoriter</h2>${cards(recipes.filter(r=>state.fav.includes(r.id)))}<h2>Sparade receptlänkar</h2><div class="panel"><form onsubmit="addLink(event)"><input id="linkname" required placeholder="Receptets namn" style="width:100%;margin-bottom:8px"><input id="linkurl" type="url" required placeholder="https://…" style="width:100%"><div class="actions"><button class="primary">Spara länk</button></div></form>${state.links.map((l,i)=>`<div class="line"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a><button onclick="state.links.splice(${i},1);save();render()">Ta bort</button></div>`).join('')}</div>`}else if(tab===3){v.innerHTML=`<h1>Veckomeny</h1><p class="muted">Planera en middag per dag.</p>${days.map((d,i)=>`<div class="panel"><b>${d}</b><div class="line"><select aria-label="${d}" onchange="plan(${i},this.value)"><option value="">Välj recept</option>${recipes.map(r=>`<option value="${r.id}" ${state.plan[i]==r.id?'selected':''}>${r.name}</option>`).join('')}</select></div></div>`).join('')}<button class="primary" onclick="weekList()">Lägg veckans ingredienser i inköpslistan</button>`}else{v.innerHTML=`<h1>Inköpslista</h1><div class="panel"><form class="actions" onsubmit="addManual(event)"><input id="manual" required placeholder="Lägg till vara" style="flex:1;min-width:0"><button class="primary">+</button></form>${state.list.map((l,i)=>`<div class="line"><label class="${l.done?'checked':''}"><input type="checkbox" ${l.done?'checked':''} onchange="state.list[${i}].done=this.checked;save();render()"> ${l.qty?esc(+l.qty.toFixed(2)+' '+l.unit+' '):''}${esc(l.name)}</label><button aria-label="Ta bort" onclick="state.list.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">Listan är tom.</p>'}</div><button onclick="state.list=state.list.filter(l=>!l.done);save();render()">Ta bort avbockade</button>`}}
function show(id,reset=true){let r=recipes.find(r=>r.id===id);if(reset)portions=4;$('detail').innerHTML=`<div class="top"><small>MATRO · EGET EXEMPELRECEPT</small><button onclick="document.getElementById('detail').close()">Stäng ×</button></div><div class="art" style="--bg:${r.bg};border-radius:16px;margin-top:12px">${art(r)}</div><h2>${r.name}</h2><small>${r.time} minuter · ${r.cat}</small><div class="actions"><button onclick="fav(${id})">${state.fav.includes(id)?'♥ Sparat':'♡ Spara'}</button><button onclick="portions=Math.max(1,portions-1);show(${id},false)">−</button><button disabled>${portions} portioner</button><button onclick="portions=Math.min(20,portions+1);show(${id},false)">+</button></div><h2>Ingredienser</h2>${r.ingredients.map(i=>`<div class="line"><label><input type="checkbox"> ${+(i[0]*portions/4).toFixed(2)} ${i[1]} ${i[2]}</label></div>`).join('')}<button class="primary" style="margin-top:15px" onclick="addRecipe(${id},portions);this.textContent='✓ Tillagt'">Lägg i inköpslistan</button><h2>Gör så här</h2>${r.steps.map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}<h2>Planera middag</h2><select onchange="plan(this.value,${id});this.disabled=true"><option value="" disabled selected>Välj dag</option>${days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select>`;if(!$('detail').open)$('detail').showModal()}
function plan(day,id){if(id)state.plan[day]=+id;else delete state.plan[day];save();render()}function addRecipe(id,p=4){recipes.find(r=>r.id===id).ingredients.forEach(([q,u,n])=>{let l=state.list.find(l=>l.name===n&&l.unit===u&&!l.done);if(l)l.qty+=q*p/4;else state.list.push({name:n,unit:u,qty:q*p/4,done:false})});save();render()}function weekList(){Object.values(state.plan).forEach(id=>addRecipe(id));go(4)}function addManual(e){e.preventDefault();let n=$('manual').value.trim();if(n)state.list.push({name:n,done:false});save();render()}function addLink(e){e.preventDefault();let url;try{url=new URL($('linkurl').value);if(!['http:','https:'].includes(url.protocol))throw 0}catch{alert('Ange en giltig webbadress.');return}state.links.push({name:$('linkname').value,url:url.href});save();render()}setTheme(state.theme||'system');render();</script></html>
