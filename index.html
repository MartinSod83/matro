<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Matro</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#28392e;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:850px;margin:auto;padding:24px 18px 110px}h1{font-family:Georgia,serif;font-size:38px;margin:12px 0}h2{font-family:Georgia,serif;font-weight:500}p{line-height:1.5}small{color:#69766c}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#e4e9df;color:#28392e}button.primary{background:#345941;color:white}input,select{border:1px solid #d7dbd1;background:white;border-radius:12px;padding:13px;max-width:100%}input[type=search]{width:100%}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:29px;font-weight:bold;letter-spacing:-1px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.recipe{background:white;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 2px 12px #263a2810}.art{height:145px;display:grid;place-items:center;font-size:76px;background:var(--bg);cursor:pointer}.info{padding:13px;cursor:pointer}.info b{display:block;margin-bottom:7px}.heart{position:absolute;right:9px;top:9px;background:#fff;color:#345941;border-radius:50%;padding:8px 11px;font-size:21px}.chips{display:flex;gap:8px;overflow:auto;margin:15px 0}.chips button{white-space:nowrap;border-radius:24px;font-size:14px}.active{background:#345941!important;color:white!important}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}nav button{background:none;flex:1;max-width:150px;font-size:11px;padding:7px 2px;color:#6d776d}nav span{display:block;font-size:23px;margin-bottom:4px}nav button.sel{color:#345941;font-weight:700} .panel{background:white;padding:16px;border-radius:16px;margin:12px 0}.line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.muted{color:#657267}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.note{font-size:12px;color:#69766c}dialog{border:0;border-radius:20px;width:min(94%,560px);max-height:88vh;padding:20px;color:inherit;background:#f7f5ef}dialog::backdrop{background:#17271c99}a{color:#345941} .checked{text-decoration:line-through;opacity:.5} @media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.art{height:180px}}

:root{color-scheme:light;--page:#f7f5ef;--surface:#fff;--ink:#28392e;--sub:#657267;--edge:#d7dbd1;--soft:#e4e9df;--accent:#345941;--on:#fff}html[data-theme=dark]{color-scheme:dark;--page:#181e1a;--surface:#242d27;--ink:#e8e9df;--sub:#aebcaf;--edge:#3b493e;--soft:#354439;--accent:#a9c59a;--on:#17251b}body,dialog{background:var(--page);color:var(--ink)}.recipe,.panel,nav,input,select{background:var(--surface);color:var(--ink)}input,select,nav,.line{border-color:var(--edge)}button{background:var(--soft);color:var(--ink)}button.primary,.active{background:var(--accent)!important;color:var(--on)!important}small,.muted,.note,nav button{color:var(--sub)}a,nav button.sel{color:var(--accent)}nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:10px}nav button svg{width:24px;height:24px;stroke-width:1.65}nav button.sel svg{background:var(--soft);border-radius:8px;box-shadow:0 0 0 5px var(--soft)}.heart{background:var(--surface);color:var(--accent)}.art{height:auto;aspect-ratio:1.35;overflow:hidden}.art svg{width:100%;height:100%;display:block}.theme{font-size:12px;padding:8px;max-width:120px}.top{gap:8px}main{padding-top:calc(20px + env(safe-area-inset-top))} @media(min-width:650px){.art{height:auto}}
</style><main><div class="top"><div class="brand">matro<span style="color:#8c9e78">.</span></div><select class="theme" aria-label="Utseende" id="theme" onchange="setTheme(this.value)"><option value="system">System</option><option value="light">Ljust</option><option value="dark">Mörkt</option></select></div><div id="view"><h1>Vad ska vi äta?</h1><p>Matro behöver JavaScript för att fungera. Om detta meddelande ligger kvar, öppna filen i Safari eller Chrome istället för i förhandsvisningen.</p></div></main><nav id="nav"></nav><dialog id="detail"></dialog><script>
window.addEventListener("error",function(e){document.getElementById("view").innerHTML="<h1>Matro kunde inte starta</h1><p></p>";document.querySelector("#view p").textContent=e.message;});
const recipes=[
{id:1,name:'Krämig citronpasta',emoji:'🍝',bg:'#e8dfbc',time:20,cat:'Vegetariskt',ingredients:[[300,'g','pasta'],[2,'dl','grädde'],[1,'st','citron'],[80,'g','parmesan']],steps:['Koka pastan enligt förpackningen.','Värm grädde med citronskal och lite citronsaft.','Vänd ner pasta och parmesan. Smaka av.']},
{id:2,name:'Kyckling med ugnsrostad potatis',emoji:'🍗',bg:'#e6c8a5',time:40,cat:'Barnvänligt',ingredients:[[600,'g','kycklingfilé'],[800,'g','potatis'],[2,'msk','olivolja'],[1,'st','citron']],steps:['Sätt ugnen på 220 grader.','Dela potatisen och rosta med olja.','Tillaga kycklingen tills innertemperaturen är 72 grader. Servera med citron.']},
{id:3,name:'Röd linsgryta',emoji:'🍲',bg:'#e5bda4',time:25,cat:'Budget',ingredients:[[3,'dl','röda linser'],[400,'ml','kokosmjölk'],[400,'g','krossade tomater'],[1,'st','gul lök']],steps:['Hacka och fräs löken.','Tillsätt linser, tomater och kokosmjölk.','Sjud tills linserna är mjuka. Smaka av.']},
{id:4,name:'Halloumitacos',emoji:'🌮',bg:'#d9dfba',time:25,cat:'Vegetariskt',ingredients:[[400,'g','halloumi'],[8,'st','tortillabröd'],[2,'st','avokado'],[1,'st','lime']],steps:['Skiva och stek halloumin.','Mosa avokado med lime.','Fyll bröden och servera.']},
{id:5,name:'Lax med dill och potatis',emoji:'🐟',bg:'#e6d4c3',time:30,cat:'Barnvänligt',ingredients:[[600,'g','lax'],[800,'g','potatis'],[2,'dl','crème fraiche'],[1,'knippe','dill']],steps:['Koka potatisen.','Tillaga laxen i ugn på 200 grader tills den är genomlagad.','Blanda crème fraiche med dill och servera.']},
{id:6,name:'Tomatsoppa med vita bönor',emoji:'🍅',bg:'#e9c6b8',time:20,cat:'Budget',ingredients:[[800,'g','krossade tomater'],[400,'g','vita bönor'],[1,'st','gul lök'],[5,'dl','grönsaksbuljong']],steps:['Fräs hackad lök.','Tillsätt tomater och buljong och sjud 10 minuter.','Tillsätt avrunna bönor och värm.']}];
const days=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];let state;try{state=JSON.parse(localStorage.getItem('matro-v1'))||{}}catch{state={}};state={fav:[],plan:{},list:[],links:[],...state};let tab=0,filter='Alla',query='',portions=4;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('matro-v1',JSON.stringify(state))}catch{}}function go(i){tab=i;filter='Alla';query='';render()}function fav(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];save();render();if($('detail').open)show(id,false)}const media=matchMedia('(prefers-color-scheme: dark)');function setTheme(v){state.theme=v;document.documentElement.dataset.theme=v==='system'?(media.matches?'dark':'light'):v;$('theme').value=v;save()}media.addEventListener('change',()=>{if(state.theme==='system')setTheme('system')});
const icons=['<path d="M3 10 12 3l9 7v10H15v-6H9v6H3z"/>','<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>','<path d="M20.8 8.5c0 4-8.8 10-8.8 10s-8.8-6-8.8-10a4.5 4.5 0 0 1 8.8-1 4.5 4.5 0 0 1 8.8 1Z"/>','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m4 0h2m-8 3h2"/>','<path d="m3 10 2 10h14l2-10H3Zm4 0 5-7 5 7M9 13v4m6-4v4"/>'];function icon(i){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[i]}</svg>`}
function art(r){const colors=['#d8b65d','#b86b42','#a84d39','#c7a454','#d67d67','#b84d40'];let c=colors[r.id-1];let food='';for(let i=0;i<12;i++){let a=i*2.39996,x=160+Math.cos(a)*(25+ i*4),y=105+Math.sin(a)*(17+i*3);if(r.id===1)food+=`<path d="M${x-15} ${y}q12 -22 25 0t25 0" fill="none" stroke="#e8bd58" stroke-width="8" stroke-linecap="round"/>`;else if(r.id===2)food+=`<rect x="${x-11}" y="${y-8}" width="24" height="16" rx="5" fill="${i%3?'#d7ae62':'#a95f3d'}" transform="rotate(${i*29} ${x} ${y})"/>`;else if(r.id===4)food+=`<rect x="${x-10}" y="${y-6}" width="20" height="12" rx="2" fill="${i%2?'#f0d28a':'#71894c'}" transform="rotate(${i*23} ${x} ${y})"/>`;else if(r.id===5)food+=`<circle cx="${x}" cy="${y}" r="9" fill="#e2bf73"/>`;else food+=`<ellipse cx="${x}" cy="${y}" rx="${r.id===6?8:4}" ry="5" fill="${r.id===6?'#f1d6a1':'#df9c57'}" transform="rotate(${i*31} ${x} ${y})"/>`;}if(r.id===5)food+='<path d="M112 76 205 83 192 137 103 126Z" fill="#d98168"/><path d="m120 88 73 8m-77 7 73 8m-77 7 73 8" stroke="#f3b69a" stroke-width="3"/>';if(r.id===4)food='<path d="M85 117Q99 45 158 78Q220 45 235 117L214 145H106Z" fill="#d7aa59"/>'+food;return `<svg viewBox="0 0 320 210" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="320" height="210" fill="${r.bg}"/><path d="M0 165 320 35V210H0Z" fill="#fff" opacity=".12"/><ellipse cx="164" cy="111" rx="111" ry="79" fill="#574c39" opacity=".15"/><ellipse cx="160" cy="105" rx="109" ry="78" fill="#f2e9d2"/><ellipse cx="160" cy="105" rx="89" ry="60" fill="${r.id===3||r.id===6?c:'#ded4b6'}"/>${food}<g fill="#526d49"><path d="M151 85q-22 -20 -26 0q15 13 26 0m0 0q23 -23 26 -4q-10 15 -26 4M177 125q-18 -16 -22 0q12 10 22 0m0 0q19 -19 23 -3q-9 12 -23 3"/></g><g fill="#453e30" opacity=".12">${Array.from({length:180},(_,i)=>`<circle cx="${(i*137)%320}" cy="${(i*73)%210}" r=".65"/>`).join('')}</g></svg>`}
function cards(rs){return `<div class="grid">${rs.map(r=>`<article class="recipe"><div class="art" style="--bg:${r.bg}" onclick="show(${r.id})">${art(r)}</div><button class="heart" aria-label="Spara favorit" onclick="fav(${r.id})">${state.fav.includes(r.id)?'♥':'♡'}</button><div class="info" onclick="show(${r.id})"><b>${r.name}</b><small>${r.time} min · ${r.cat}</small></div></article>`).join('')}</div>${rs.length?'':'<p class="muted">Inga recept hittades.</p>'}`}
function results(){let rs=recipes.filter(r=>(filter==='Alla'||(filter==='Snabblagat'?r.time<=25:r.cat===filter))&&(!query||(r.name+' '+r.ingredients.map(i=>i[2]).join(' ')).toLowerCase().includes(query.toLowerCase())));$('results').innerHTML=cards(rs)}function setFilter(f){filter=f;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('active',b.textContent===f));results()}
function render(){ $('nav').innerHTML=['⌂|Upptäck','⌕|Sök','♡|Mina recept','▦|Veckomeny','☷|Inköpslista'].map((x,i)=>`<button class="${tab===i?'sel':''}" aria-current="${tab===i?'page':'false'}" onclick="go(${i})">${icon(i)}${x.split('|')[1]}</button>`).join('');let v=$('view');if(tab<2){v.innerHTML=`<h1>${tab?'Hitta ditt recept':'Vad ska vi äta?'}</h1><p class="muted">${tab?'Sök på maträtt eller ingrediens.':'God mat. Mindre vardagsstress.'}</p><input type="search" placeholder="Sök recept eller ingrediens" value="${esc(query)}" oninput="query=this.value;results()"><div class="chips">${['Alla','Snabblagat','Vegetariskt','Budget','Barnvänligt'].map(f=>`<button class="${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><h2>${tab?'Sökresultat':'Inspiration till middagen'}</h2><div id="results"></div><p class="note">Prototyp · Sex egna exempelrecept. Extern receptsökning är inte ansluten.</p>`;results()}else if(tab===2){v.innerHTML=`<h1>Mina recept</h1><h2>Favoriter</h2>${cards(recipes.filter(r=>state.fav.includes(r.id)))}<h2>Sparade receptlänkar</h2><div class="panel"><form onsubmit="addLink(event)"><input id="linkname" required placeholder="Receptets namn" style="width:100%;margin-bottom:8px"><input id="linkurl" type="url" required placeholder="https://…" style="width:100%"><div class="actions"><button class="primary">Spara länk</button></div></form>${state.links.map((l,i)=>`<div class="line"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a><button onclick="state.links.splice(${i},1);save();render()">Ta bort</button></div>`).join('')}</div>`}else if(tab===3){v.innerHTML=`<h1>Veckomeny</h1><p class="muted">Planera en middag per dag.</p>${days.map((d,i)=>`<div class="panel"><b>${d}</b><div class="line"><select aria-label="${d}" onchange="plan(${i},this.value)"><option value="">Välj recept</option>${recipes.map(r=>`<option value="${r.id}" ${state.plan[i]==r.id?'selected':''}>${r.name}</option>`).join('')}</select></div></div>`).join('')}<button class="primary" onclick="weekList()">Lägg veckans ingredienser i inköpslistan</button>`}else{v.innerHTML=`<h1>Inköpslista</h1><div class="panel"><form class="actions" onsubmit="addManual(event)"><input id="manual" required placeholder="Lägg till vara" style="flex:1;min-width:0"><button class="primary">+</button></form>${state.list.map((l,i)=>`<div class="line"><label class="${l.done?'checked':''}"><input type="checkbox" ${l.done?'checked':''} onchange="state.list[${i}].done=this.checked;save();render()"> ${l.qty?esc(+l.qty.toFixed(2)+' '+l.unit+' '):''}${esc(l.name)}</label><button aria-label="Ta bort" onclick="state.list.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">Listan är tom.</p>'}</div><button onclick="state.list=state.list.filter(l=>!l.done);save();render()">Ta bort avbockade</button>`}}
function show(id,reset=true){let r=recipes.find(r=>r.id===id);if(reset)portions=4;$('detail').innerHTML=`<div class="top"><small>MATRO · EGET EXEMPELRECEPT</small><button onclick="document.getElementById('detail').close()">Stäng ×</button></div><div class="art" style="--bg:${r.bg};border-radius:16px;margin-top:12px">${art(r)}</div><h2>${r.name}</h2><small>${r.time} minuter · ${r.cat}</small><div class="actions"><button onclick="fav(${id})">${state.fav.includes(id)?'♥ Sparat':'♡ Spara'}</button><button onclick="portions=Math.max(1,portions-1);show(${id},false)">−</button><button disabled>${portions} portioner</button><button onclick="portions=Math.min(20,portions+1);show(${id},false)">+</button></div><h2>Ingredienser</h2>${r.ingredients.map(i=>`<div class="line"><label><input type="checkbox"> ${+(i[0]*portions/4).toFixed(2)} ${i[1]} ${i[2]}</label></div>`).join('')}<button class="primary" style="margin-top:15px" onclick="addRecipe(${id},portions);this.textContent='✓ Tillagt'">Lägg i inköpslistan</button><h2>Gör så här</h2>${r.steps.map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}<h2>Planera middag</h2><select onchange="plan(this.value,${id});this.disabled=true"><option value="" disabled selected>Välj dag</option>${days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select>`;if(!$('detail').open)$('detail').showModal()}
function plan(day,id){if(id)state.plan[day]=+id;else delete state.plan[day];save();render()}function addRecipe(id,p=4){recipes.find(r=>r.id===id).ingredients.forEach(([q,u,n])=>{let l=state.list.find(l=>l.name===n&&l.unit===u&&!l.done);if(l)l.qty+=q*p/4;else state.list.push({name:n,unit:u,qty:q*p/4,done:false})});save();render()}function weekList(){Object.values(state.plan).forEach(id=>addRecipe(id));go(4)}function addManual(e){e.preventDefault();let n=$('manual').value.trim();if(n)state.list.push({name:n,done:false});save();render()}function addLink(e){e.preventDefault();let url;try{url=new URL($('linkurl').value);if(!['http:','https:'].includes(url.protocol))throw 0}catch{alert('Ange en giltig webbadress.');return}state.links.push({name:$('linkname').value,url:url.href});save();render()}setTheme(state.theme||'system');render();</script></html>
