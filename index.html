<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Matro</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#28392e;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:850px;margin:auto;padding:24px 18px 110px}h1{font-family:Georgia,serif;font-size:38px;margin:12px 0}h2{font-family:Georgia,serif;font-weight:500}p{line-height:1.5}small{color:#69766c}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#e4e9df;color:#28392e}button.primary{background:#345941;color:white}input,select{border:1px solid #d7dbd1;background:white;border-radius:12px;padding:13px;max-width:100%}input[type=search]{width:100%}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:29px;font-weight:bold;letter-spacing:-1px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.recipe{background:white;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 2px 12px #263a2810}.art{height:145px;display:grid;place-items:center;font-size:76px;background:var(--bg);cursor:pointer}.info{padding:13px;cursor:pointer}.info b{display:block;margin-bottom:7px}.heart{position:absolute;right:9px;top:9px;background:#fff;color:#345941;border-radius:50%;padding:8px 11px;font-size:21px}.chips{display:flex;gap:8px;overflow:auto;margin:15px 0}.chips button{white-space:nowrap;border-radius:24px;font-size:14px}.active{background:#345941!important;color:white!important}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}nav button{background:none;flex:1;max-width:150px;font-size:11px;padding:7px 2px;color:#6d776d}nav span{display:block;font-size:23px;margin-bottom:4px}nav button.sel{color:#345941;font-weight:700} .panel{background:white;padding:16px;border-radius:16px;margin:12px 0}.line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.line:last-child{border:0}.muted{color:#657267}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.note{font-size:12px;color:#69766c}dialog{border:0;border-radius:20px;width:min(94%,560px);max-height:88vh;padding:20px;color:inherit;background:#f7f5ef}dialog::backdrop{background:#17271c99}a{color:#345941} .checked{text-decoration:line-through;opacity:.5} @media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.art{height:180px}}
</style><main><div class="top"><div class="brand">matro<span style="color:#8c9e78">.</span></div><small>Din vardag, lite enklare</small></div><div id="view"><h1>Vad ska vi äta?</h1><p>Matro behöver JavaScript för att fungera. Om detta meddelande ligger kvar, öppna filen i Safari eller Chrome istället för i förhandsvisningen.</p></div></main><nav id="nav"></nav><dialog id="detail"></dialog><script>
window.addEventListener("error",function(e){document.getElementById("view").innerHTML="<h1>Matro kunde inte starta</h1><p></p>";document.querySelector("#view p").textContent=e.message;});
const recipes=[
{id:1,name:'Krämig citronpasta',emoji:'🍝',bg:'#e8dfbc',time:20,cat:'Vegetariskt',ingredients:[[300,'g','pasta'],[2,'dl','grädde'],[1,'st','citron'],[80,'g','parmesan']],steps:['Koka pastan enligt förpackningen.','Värm grädde med citronskal och lite citronsaft.','Vänd ner pasta och parmesan. Smaka av.']},
{id:2,name:'Kyckling med ugnsrostad potatis',emoji:'🍗',bg:'#e6c8a5',time:40,cat:'Barnvänligt',ingredients:[[600,'g','kycklingfilé'],[800,'g','potatis'],[2,'msk','olivolja'],[1,'st','citron']],steps:['Sätt ugnen på 220 grader.','Dela potatisen och rosta med olja.','Tillaga kycklingen tills innertemperaturen är 72 grader. Servera med citron.']},
{id:3,name:'Röd linsgryta',emoji:'🍲',bg:'#e5bda4',time:25,cat:'Budget',ingredients:[[3,'dl','röda linser'],[400,'ml','kokosmjölk'],[400,'g','krossade tomater'],[1,'st','gul lök']],steps:['Hacka och fräs löken.','Tillsätt linser, tomater och kokosmjölk.','Sjud tills linserna är mjuka. Smaka av.']},
{id:4,name:'Halloumitacos',emoji:'🌮',bg:'#d9dfba',time:25,cat:'Vegetariskt',ingredients:[[400,'g','halloumi'],[8,'st','tortillabröd'],[2,'st','avokado'],[1,'st','lime']],steps:['Skiva och stek halloumin.','Mosa avokado med lime.','Fyll bröden och servera.']},
{id:5,name:'Lax med dill och potatis',emoji:'🐟',bg:'#e6d4c3',time:30,cat:'Barnvänligt',ingredients:[[600,'g','lax'],[800,'g','potatis'],[2,'dl','crème fraiche'],[1,'knippe','dill']],steps:['Koka potatisen.','Tillaga laxen i ugn på 200 grader tills den är genomlagad.','Blanda crème fraiche med dill och servera.']},
{id:6,name:'Tomatsoppa med vita bönor',emoji:'🍅',bg:'#e9c6b8',time:20,cat:'Budget',ingredients:[[800,'g','krossade tomater'],[400,'g','vita bönor'],[1,'st','gul lök'],[5,'dl','grönsaksbuljong']],steps:['Fräs hackad lök.','Tillsätt tomater och buljong och sjud 10 minuter.','Tillsätt avrunna bönor och värm.']}];
const days=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];let state;try{state=JSON.parse(localStorage.getItem('matro-v1'))||{}}catch{state={}};state={fav:[],plan:{},list:[],links:[],...state};let tab=0,filter='Alla',query='',portions=4;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('matro-v1',JSON.stringify(state))}catch{}}function go(i){tab=i;filter='Alla';query='';render()}function fav(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];save();render();if($('detail').open)show(id,false)}function cards(rs){return `<div class="grid">${rs.map(r=>`<article class="recipe"><div class="art" style="--bg:${r.bg}" onclick="show(${r.id})">${r.emoji}</div><button class="heart" aria-label="Spara favorit" onclick="fav(${r.id})">${state.fav.includes(r.id)?'♥':'♡'}</button><div class="info" onclick="show(${r.id})"><b>${r.name}</b><small>${r.time} min · ${r.cat}</small></div></article>`).join('')}</div>${rs.length?'':'<p class="muted">Inga recept hittades.</p>'}`}
function results(){let rs=recipes.filter(r=>(filter==='Alla'||(filter==='Snabblagat'?r.time<=25:r.cat===filter))&&(!query||(r.name+' '+r.ingredients.map(i=>i[2]).join(' ')).toLowerCase().includes(query.toLowerCase())));$('results').innerHTML=cards(rs)}function setFilter(f){filter=f;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('active',b.textContent===f));results()}
function render(){ $('nav').innerHTML=['⌂|Upptäck','⌕|Sök','♡|Mina recept','▦|Veckomeny','☷|Inköpslista'].map((x,i)=>`<button class="${tab===i?'sel':''}" onclick="go(${i})"><span>${x.split('|')[0]}</span>${x.split('|')[1]}</button>`).join('');let v=$('view');if(tab<2){v.innerHTML=`<h1>${tab?'Hitta ditt recept':'Vad ska vi äta?'}</h1><p class="muted">${tab?'Sök på maträtt eller ingrediens.':'God mat. Mindre vardagsstress.'}</p><input type="search" placeholder="Sök recept eller ingrediens" value="${esc(query)}" oninput="query=this.value;results()"><div class="chips">${['Alla','Snabblagat','Vegetariskt','Budget','Barnvänligt'].map(f=>`<button class="${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div><h2>${tab?'Sökresultat':'Inspiration till middagen'}</h2><div id="results"></div><p class="note">Prototyp · Sex egna exempelrecept. Extern receptsökning är inte ansluten.</p>`;results()}else if(tab===2){v.innerHTML=`<h1>Mina recept</h1><h2>Favoriter</h2>${cards(recipes.filter(r=>state.fav.includes(r.id)))}<h2>Sparade receptlänkar</h2><div class="panel"><form onsubmit="addLink(event)"><input id="linkname" required placeholder="Receptets namn" style="width:100%;margin-bottom:8px"><input id="linkurl" type="url" required placeholder="https://…" style="width:100%"><div class="actions"><button class="primary">Spara länk</button></div></form>${state.links.map((l,i)=>`<div class="line"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a><button onclick="state.links.splice(${i},1);save();render()">Ta bort</button></div>`).join('')}</div>`}else if(tab===3){v.innerHTML=`<h1>Veckomeny</h1><p class="muted">Planera en middag per dag.</p>${days.map((d,i)=>`<div class="panel"><b>${d}</b><div class="line"><select aria-label="${d}" onchange="plan(${i},this.value)"><option value="">Välj recept</option>${recipes.map(r=>`<option value="${r.id}" ${state.plan[i]==r.id?'selected':''}>${r.name}</option>`).join('')}</select></div></div>`).join('')}<button class="primary" onclick="weekList()">Lägg veckans ingredienser i inköpslistan</button>`}else{v.innerHTML=`<h1>Inköpslista</h1><div class="panel"><form class="actions" onsubmit="addManual(event)"><input id="manual" required placeholder="Lägg till vara" style="flex:1;min-width:0"><button class="primary">+</button></form>${state.list.map((l,i)=>`<div class="line"><label class="${l.done?'checked':''}"><input type="checkbox" ${l.done?'checked':''} onchange="state.list[${i}].done=this.checked;save();render()"> ${l.qty?esc(+l.qty.toFixed(2)+' '+l.unit+' '):''}${esc(l.name)}</label><button aria-label="Ta bort" onclick="state.list.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">Listan är tom.</p>'}</div><button onclick="state.list=state.list.filter(l=>!l.done);save();render()">Ta bort avbockade</button>`}}
function show(id,reset=true){let r=recipes.find(r=>r.id===id);if(reset)portions=4;$('detail').innerHTML=`<div class="top"><small>MATRO · EGET EXEMPELRECEPT</small><button onclick="document.getElementById('detail').close()">Stäng ×</button></div><div class="art" style="--bg:${r.bg};border-radius:16px;margin-top:12px">${r.emoji}</div><h2>${r.name}</h2><small>${r.time} minuter · ${r.cat}</small><div class="actions"><button onclick="fav(${id})">${state.fav.includes(id)?'♥ Sparat':'♡ Spara'}</button><button onclick="portions=Math.max(1,portions-1);show(${id},false)">−</button><button disabled>${portions} portioner</button><button onclick="portions=Math.min(20,portions+1);show(${id},false)">+</button></div><h2>Ingredienser</h2>${r.ingredients.map(i=>`<div class="line"><label><input type="checkbox"> ${+(i[0]*portions/4).toFixed(2)} ${i[1]} ${i[2]}</label></div>`).join('')}<button class="primary" style="margin-top:15px" onclick="addRecipe(${id},portions);this.textContent='✓ Tillagt'">Lägg i inköpslistan</button><h2>Gör så här</h2>${r.steps.map((s,i)=>`<p><b>${i+1}.</b> ${s}</p>`).join('')}<h2>Planera middag</h2><select onchange="plan(this.value,${id});this.disabled=true"><option value="" disabled selected>Välj dag</option>${days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select>`;if(!$('detail').open)$('detail').showModal()}
function plan(day,id){if(id)state.plan[day]=+id;else delete state.plan[day];save();render()}function addRecipe(id,p=4){recipes.find(r=>r.id===id).ingredients.forEach(([q,u,n])=>{let l=state.list.find(l=>l.name===n&&l.unit===u&&!l.done);if(l)l.qty+=q*p/4;else state.list.push({name:n,unit:u,qty:q*p/4,done:false})});save();render()}function weekList(){Object.values(state.plan).forEach(id=>addRecipe(id));go(4)}function addManual(e){e.preventDefault();let n=$('manual').value.trim();if(n)state.list.push({name:n,done:false});save();render()}function addLink(e){e.preventDefault();let url;try{url=new URL($('linkurl').value);if(!['http:','https:'].includes(url.protocol))throw 0}catch{alert('Ange en giltig webbadress.');return}state.links.push({name:$('linkname').value,url:url.href});save();render()}render();</script></html>
